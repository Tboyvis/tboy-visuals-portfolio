
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viewing — Tboy Visuals</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="viewer.css">
</head>

<body class="viewer-page">

    <main class="viewer">

        <a href="#" class="viewer-back">← BACK TO ARCHIVE</a>

        <div class="viewer-gallery">

            <button class="viewer-side viewer-prev" aria-label="Previous image">
                <img src="" alt="">
            </button>

            <div class="viewer-main">
                <img src="" alt="">
            </div>

            <button class="viewer-side viewer-next" aria-label="Next image">
                <img src="" alt="">
            </button>

        </div>

        <div class="viewer-info">
            <span class="viewer-project"></span>
            <span class="viewer-counter"></span>
        </div>

    </main>

    <script src="viewer.js"></script>

</body>
</html>
